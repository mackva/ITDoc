# docker-compose.yaml file
version: "3.5"

services:
  esphome:
    image: esphome/esphome
    container_name: esphome
    ports:
      - 6052:6052
    volumes:
      # HERE we will add the livingroom.yaml
      - /opt/esphome:/config
    network_mode: host
    # Important to flash using USB
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0